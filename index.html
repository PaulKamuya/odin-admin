<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar-container">

      <div class="sidebar-header">
        Dashboard
      </div>

      <div class="sidebar-options">
        <div>Home</div>
        <div>Profile</div>
        <div>Messages</div>
        <div>History</div>
        <div>Tasks</div>
        <div>Communities</div>
      </div>

      <div class="sidebar-options">
        <div>Settings</div>
        <div>Support</div>
        <div>Privacy</div>
      </div>
    </div>

    <!-- Right column -->
    <div class="top-container">
      <div class="search">
        <input type="text">
      </div>

      <div class="user-profile">
        <img src="" alt="" class="pfp small">
        <p class="bold">Someone same</p>
      </div>

      <div class="current">
        <img src="" alt="" class="pfp">
        <div class="intro">
          <p class="bold small">Hi there,</p>
          <p class="bold large">Someone same (@someonesame)</p>
        </div>
      </div>

      <div class="btn-container">
        <button>New</button>
        <button>Upload</button>
        <button>Share</button>
      </div>
    </div>

    <div class="main-grid">
      <p class="section-header"></p>
      <div class="project-container"></div>

      <p class="section-header"></p>
      <div class="minor-container"></div>

      <p class="section-header"></p>
      <div class="minor-container"></div>
    </div>
</body>
</html>
